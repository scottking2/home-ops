---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cruise-caller-openai
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cruise-caller-openai-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-key
        property: OPENAI_API_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cruise-caller-twilio
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cruise-caller-twilio-secret
    creationPolicy: Owner
  data:
    - secretKey: TWILIO_ACCOUNT_SID
      remoteRef:
        key: cruise-caller
        property: TWILIO_ACCOUNT_SID
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: cruise-caller
        property: TWILIO_AUTH_TOKEN
    - secretKey: TWILIO_FROM_NUMBER
      remoteRef:
        key: cruise-caller
        property: TWILIO_FROM_NUMBER
    - secretKey: DEFAULT_TO_NUMBER
      remoteRef:
        key: cruise-caller
        property: DEFAULT_TO_NUMBER
