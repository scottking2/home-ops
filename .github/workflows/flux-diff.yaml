---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Diff"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        resource: ["hr", "ks"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true
          version: "0.6.0"
          # Materialize default branch for changed-only diffs via FLATE_BASE.
          base: ${{ github.event.repository.default_branch }}

      - name: Diff Resources
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          # Walk Flux from kubernetes/flux; flate follows KS spec.path.
          # --allow-missing-secrets soft-skips SOPS/in-cluster secrets offline.
          diff_out="$(
            flate diff "${{ matrix.resource }}" \
              --path ./kubernetes/flux \
              --output diff \
              --allow-missing-secrets \
              --strip-attr helm.sh/chart \
              --strip-attr checksum/config \
              --strip-attr checksum/secret \
              --strip-attr app.kubernetes.io/version \
              --strip-attr chart
          )"

          {
            echo "diff<<EOF"
            printf '%s\n' "${diff_out}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          if [[ -n "${diff_out}" ]]; then
            echo "${diff_out}"
          else
            echo "No ${{ matrix.resource }} diff"
          fi

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add comment
        uses: mshick/add-pr-comment@v3
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
