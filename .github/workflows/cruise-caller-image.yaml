---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Cruise Caller image"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/cruise-caller/**"
      - ".github/workflows/cruise-caller-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/cruise-caller
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cruise-caller:main
            ghcr.io/${{ github.repository }}/cruise-caller:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
